<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Advanced Academic PDF Text Formatter</title>
<style>
  /* ——— Base layout & visuals (your original, trimmed where unchanged) ——— */
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background:linear-gradient(135deg,#1e3c72 0%,#2a5298 50%,#667eea 100%);
    min-height:100vh;overflow-x:hidden
  }
  .floating-shapes{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:1}
  .shape{position:absolute;opacity:.1;animation:float 20s infinite linear}
  .shape:nth-child(1){top:20%;left:10%;width:80px;height:80px;background:#ff6b6b;border-radius:50%}
  .shape:nth-child(2){top:70%;right:15%;width:60px;height:60px;background:#4ecdc4;transform:rotate(45deg);animation-delay:-5s}
  .shape:nth-child(3){top:40%;right:20%;width:100px;height:100px;background:#ffe66d;clip-path:polygon(50% 0%,0% 100%,100% 100%);animation-delay:-10s}
  @keyframes float{0%{transform:translateY(0) rotate(0)}50%{transform:translateY(-20px) rotate(180deg)}100%{transform:translateY(0) rotate(360deg)}}
  .container{position:relative;z-index:2;max-width:1600px;margin:20px auto;background:rgba(255,255,255,.98);border-radius:25px;box-shadow:0 30px 60px rgba(0,0,0,.2);overflow:hidden}
  .header{background:linear-gradient(135deg,#667eea 0%,#764ba2 50%,#f093fb 100%);padding:40px;text-align:center;color:#fff;position:relative;overflow:hidden}
  .header h1{font-size:3em;margin-bottom:15px;font-weight:800;text-shadow:2px 2px 4px rgba(0,0,0,.3)}
  .header p{font-size:1.3em;opacity:.95;font-weight:300}
  .main-content{display:grid;grid-template-columns:2fr 3fr;min-height:800px}
  .input-section{padding:40px;background:linear-gradient(135deg,#f8fafc 0%,#e2e8f0 100%);border-right:2px solid #cbd5e0}
  .output-section{padding:40px;background:linear-gradient(135deg,#fff 0%,#f7fafc 100%)}
  .section-title{font-size:1.6em;font-weight:700;color:#2d3748;margin-bottom:25px;display:flex;gap:12px;padding-bottom:10px;border-bottom:3px solid #667eea}
  .academic-settings{background:#fff;padding:25px;border-radius:15px;box-shadow:0 8px 25px rgba(0,0,0,.1);margin-bottom:25px}
  .settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px}
  .form-group{display:flex;flex-direction:column;gap:8px}
  .form-group label{font-weight:600;color:#4a5568;font-size:.95em}
  .form-group select,.form-group input{padding:12px;border:2px solid #e2e8f0;border-radius:10px;font-size:1em;transition:.3s;background:#fff}
  .form-group select:focus,.form-group input:focus{outline:none;border-color:#667eea;box-shadow:0 0 0 4px rgba(102,126,234,.1);transform:translateY(-1px)}
  .advanced-options{display:grid;grid-template-columns:1fr 1fr 1fr;gap:15px;margin-top:20px}
  .checkbox-group{display:flex;align-items:center;gap:8px}
  .checkbox-group input[type=checkbox]{width:18px;height:18px;accent-color:#667eea}
  .toolbar{display:flex;gap:8px;margin:12px 0 8px 0;flex-wrap:wrap}
  .tbtn{padding:8px 10px;border:1px solid #d1d5db;border-radius:8px;background:#fff;cursor:pointer;font-weight:600}
  .tbtn:hover{background:#f3f4f6}
  .textarea-container{position:relative;margin-bottom:12px}
  .input-textarea{width:100%;height:320px;padding:16px;border:2px solid #e2e8f0;border-radius:15px;font-family:'Georgia',serif;font-size:15px;line-height:1.6;resize:vertical;background:#fff}
  .format-btn{width:100%;padding:18px;background:linear-gradient(135deg,#667eea 0%,#764ba2 50%,#f093fb 100%);color:#fff;border:none;border-radius:15px;font-size:1.2em;font-weight:700;cursor:pointer;box-shadow:0 8px 25px rgba(102,126,234,.3)}
  .output-textarea{width:100%;height:380px;padding:20px;border:2px solid #d1d5db;border-radius:15px;font-family:'Times New Roman',serif;font-size:12px;line-height:1.4;background:#f9fafb;resize:vertical;margin-bottom:20px}
  .action-buttons{display:grid;grid-template-columns:1fr 1fr 1fr;gap:15px;margin-bottom:25px}
  .copy-btn,.download-btn,.pdf-btn{padding:14px;border:none;border-radius:10px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;color:#fff}
  .copy-btn{background:linear-gradient(135deg,#10b981,#059669)}
  .download-btn{background:linear-gradient(135deg,#3b82f6,#1d4ed8)}
  .pdf-btn{background:linear-gradient(135deg,#dc2626,#991b1b)}
  .stats-panel{background:#fff;border-radius:15px;padding:20px;box-shadow:0 8px 25px rgba(0,0,0,.1);margin-top:18px}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}
  .stat-card{text-align:center;padding:15px;background:linear-gradient(135deg,#f8fafc,#e2e8f0);border-radius:10px;border:1px solid #cbd5e0}
  .stat-value{font-size:1.8em;font-weight:800;color:#667eea;display:block}
  .preview-panel{background:#fff;border-radius:15px;padding:25px;box-shadow:0 8px 25px rgba(0,0,0,.1);border:2px solid #e5e7eb}
  .preview-content{font-family:var(--preview-font);font-size:var(--preview-size);line-height:1.5;color:#1f2937}
  .preview-page{margin-bottom:20px;padding:15px;border:1px dashed #cbd5e0;border-radius:8px}
  .preview-paragraph{text-align:justify;margin-bottom:12px;text-indent:20px}
  .preview-h1{font-size:1.6em;font-weight:800;margin:12px 0 8px 0;text-align:center}
  .preview-h2{font-size:1.35em;font-weight:700;margin:12px 0 8px 0}
  .preview-h3{font-size:1.2em;font-weight:700;margin:10px 0 6px 0}
  .preview-bold{font-weight:700}
  .preview-italic{font-style:italic}
  .preview-title{font-weight:800;text-align:center;margin-bottom:16px}
  .page-header{text-align:right;font-size:.9em;color:#6b7280;margin-bottom:10px;font-style:italic}
  @media (max-width:1200px){.main-content{grid-template-columns:1fr}.advanced-options{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}}
  @media (max-width:768px){.action-buttons{grid-template-columns:1fr}.header h1{font-size:2em}.stats{grid-template-columns:1fr}}
</style>
</head>
<body>
  <div class="floating-shapes"><div class="shape"></div><div class="shape"></div><div class="shape"></div></div>
  <div class="container">
    <div class="header">
      <h1>📚 Advanced Academic PDF Formatter</h1>
      <p>Professional document formatting for academic papers, assignments & reports</p>
    </div>

    <div class="main-content">
      <!-- LEFT: settings & input -->
      <div class="input-section">
        <h2 class="section-title"><span>⚙️</span>Document Settings & Input</h2>

        <div class="academic-settings">
          <div class="settings-grid">
            <div class="form-group">
              <label>Document Type</label>
              <select id="docType">
                <option value="general">General Document</option>
                <option value="report">Business Report</option>
                <option value="academic">Academic Paper</option>
                <option value="assignment">Academic Assignment</option>
                <option value="resume">Resume/CV</option>
                <option value="letter">Formal Letter</option>
                <option value="essay">Essay/Article</option>
                <option value="memo">Memo/Notice</option>
                <option value="thesis">Thesis/Dissertation</option>
              </select>
            </div>

            <div class="form-group">
              <label>Font Family</label>
              <select id="fontFamily">
                <option value="Times New Roman">Times New Roman</option>
                <option value="Arial">Arial</option>
                <option value="Georgia">Georgia</option>
                <option value="Calibri">Calibri</option>
                <option value="Garamond">Garamond</option>
              </select>
            </div>

            <div class="form-group">
              <label>Font Size</label>
              <select id="fontSize">
                <option value="10">10pt</option>
                <option value="11">11pt</option>
                <option value="12" selected>12pt</option>
                <option value="14">14pt</option>
                <option value="16">16pt</option>
              </select>
            </div>

            <div class="form-group">
              <label>Words Per Page</label>
              <input type="number" id="wordsPerPage" value="400" min="200" max="800"/>
            </div>

            <div class="form-group">
              <label>Line Spacing</label>
              <select id="lineSpacing">
                <option value="1.0">Single (1.0)</option>
                <option value="1.15">1.15</option>
                <option value="1.3" selected>1.3</option>
                <option value="1.5">1.5</option>
                <option value="2.0">Double (2.0)</option>
              </select>
            </div>

            <div class="form-group">
              <label>Page Margins</label>
              <select id="margins">
                <option value="normal" selected>Normal (1 inch)</option>
                <option value="narrow">Narrow (0.5 inch)</option>
                <option value="wide">Wide (1.5 inch)</option>
              </select>
            </div>
          </div>

          <div class="settings-grid">
            <div class="form-group">
              <label>Document Title (optional*)</label>
              <input id="docTitle" placeholder="Shown on first page / header based on type"/>
            </div>
            <div class="form-group">
              <label>Author Name (optional)</label>
              <input id="authorName" placeholder="Shown under title or as subtitle"/>
            </div>
          </div>

          <div class="advanced-options">
            <div class="checkbox-group">
              <input type="checkbox" id="addPageNumbers" checked/>
              <label for="addPageNumbers">Add Page Numbers</label>
            </div>
            <div class="checkbox-group">
              <input type="checkbox" id="addHeaders" checked/>
              <label for="addHeaders">Page Headers</label>
            </div>
            <div class="checkbox-group">
              <input type="checkbox" id="autoStripHashes" checked/>
              <label for="autoStripHashes">Strip pasted # headings</label>
            </div>
          </div>
        </div>

        <!-- Toolbar -->
        <div class="toolbar">
          <button class="tbtn" onclick="wrapSelection('**','**')"><b>B</b></button>
          <button class="tbtn" onclick="wrapSelection('_','_')"><em>I</em></button>
          <button class="tbtn" onclick="applyHeading(1)">H1</button>
          <button class="tbtn" onclick="applyHeading(2)">H2</button>
          <button class="tbtn" onclick="applyHeading(3)">H3</button>
          <button class="tbtn" onclick="clearSeparators()">🧹 Clean</button>
        </div>

        <div class="textarea-container">
          <textarea class="input-textarea" id="inputText"
            placeholder="Paste your content… (We’ll remove emojis/separator lines. 'Got it' text is kept.)"></textarea>
        </div>

        <button class="format-btn" onclick="formatAcademicText()"><span>✨</span>Format Document</button>

        <div class="stats-panel">
          <div class="stats">
            <div class="stat-card"><span class="stat-value" id="wordCount">0</span><span>Words</span></div>
            <div class="stat-card"><span class="stat-value" id="pageCount">0</span><span>Pages</span></div>
            <div class="stat-card"><span class="stat-value" id="paragraphCount">0</span><span>Paragraphs</span></div>
            <div class="stat-card"><span class="stat-value" id="questionCount">0</span><span>Questions</span></div>
          </div>
        </div>
      </div>

      <!-- RIGHT: output & preview -->
      <div class="output-section">
        <h2 class="section-title"><span>📋</span>Formatted Document Output</h2>
        <textarea class="output-textarea" id="outputText" readonly
          placeholder="Your professionally formatted document will appear here…"></textarea>

        <div class="action-buttons">
          <button class="copy-btn" onclick="copyToClipboard()">📋 Copy Text</button>
          <button class="download-btn" onclick="downloadText()">💾 Download TXT</button>
          <button class="pdf-btn" onclick="generatePDF()">📄 Generate PDF</button>
        </div>

        <div class="preview-panel">
          <h3 style="margin-bottom: 15px; color:#374151; font-weight:600;">📖 Live Preview</h3>
          <div class="preview-content" id="previewContent">
            <div style="text-align:center;color:#9ca3af;padding:40px;">Format your document to see the live preview…</div>
          </div>
        </div>
      </div>
    </div>
  </div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
const { jsPDF } = window.jspdf;

/* -------------------- Persistence -------------------- */
const persistKeys = ["docType","fontFamily","fontSize","wordsPerPage","lineSpacing","margins","addPageNumbers","addHeaders","autoStripHashes","docTitle","authorName","inputText"];
window.addEventListener("load", () => {
  persistKeys.forEach(k=>{
    const el = document.getElementById(k);
    if(!el) return;
    const v = localStorage.getItem("advpdf_"+k);
    if(v!==null){
      if(el.type==="checkbox") el.checked = v==="true";
      else el.value = v;
    }
  });
  applyDocTypePresets(); // set sensible defaults on load
  updateStats();
});
document.addEventListener("input", (e)=>{
  const id = e.target.id;
  if(persistKeys.includes(id)){
    localStorage.setItem("advpdf_"+id, e.target.type==="checkbox"? String(e.target.checked): e.target.value);
  }
});

/* -------------------- DocType presets -------------------- */
document.getElementById("docType").addEventListener("change", applyDocTypePresets);
function applyDocTypePresets(){
  const t = document.getElementById("docType").value;
  const set = (id,val)=>{const el=document.getElementById(id); if(el){el.value=val}};
  const setC = (id,val)=>{const el=document.getElementById(id); if(el){el.checked=val}};

  switch(t){
    case "general": set("fontFamily","Times New Roman"); set("fontSize","12"); set("lineSpacing","1.3"); set("margins","normal"); setC("addHeaders",true); setC("addPageNumbers",true); break;
    case "report":  set("fontFamily","Calibri"); set("fontSize","12"); set("lineSpacing","1.3"); set("margins","normal"); setC("addHeaders",true); setC("addPageNumbers",true); break;
    case "academic":set("fontFamily","Times New Roman"); set("fontSize","12"); set("lineSpacing","1.5"); set("margins","wide"); setC("addHeaders",true); setC("addPageNumbers",true); break;
    case "assignment":set("fontFamily","Times New Roman"); set("fontSize","12"); set("lineSpacing","1.3"); set("margins","normal"); setC("addHeaders",true); setC("addPageNumbers",true); break;
    case "resume":  set("fontFamily","Arial"); set("fontSize","11"); set("lineSpacing","1.25"); set("margins","narrow"); setC("addHeaders",false); setC("addPageNumbers",false); break;
    case "letter":  set("fontFamily","Times New Roman"); set("fontSize","12"); set("lineSpacing","1.3"); set("margins","normal"); setC("addHeaders",false); setC("addPageNumbers",false); break;
    case "essay":   set("fontFamily","Georgia"); set("fontSize","12"); set("lineSpacing","1.4"); set("margins","normal"); setC("addHeaders",true); setC("addPageNumbers",true); break;
    case "memo":    set("fontFamily","Arial"); set("fontSize","12"); set("lineSpacing","1.3"); set("margins","normal"); setC("addHeaders",true); setC("addPageNumbers",true); break;
    case "thesis":  set("fontFamily","Garamond"); set("fontSize","12"); set("lineSpacing","1.5"); set("margins","wide"); setC("addHeaders",true); setC("addPageNumbers",true); break;
  }
}

/* -------------------- Text tools (toolbar) -------------------- */
function getTA(){return document.getElementById("inputText")}
function wrapSelection(left,right){
  const ta=getTA(); const s=ta.selectionStart, e=ta.selectionEnd;
  if(s===e) return; const before=ta.value.slice(0,s), mid=ta.value.slice(s,e), after=ta.value.slice(e);
  const already = mid.startsWith(left) && mid.endsWith(right);
  const newMid = already ? mid.slice(left.length, mid.length-right.length) : left+mid+right;
  ta.value = before + newMid + after; ta.focus(); ta.selectionStart = s; ta.selectionEnd = s + newMid.length;
  updateStats();
}
function applyHeading(level){
  const ta=getTA(); const s=ta.selectionStart, e=ta.selectionEnd;
  const lines = ta.value.split("\n");
  let pos=0;
  for(let i=0;i<lines.length;i++){
    const L = lines[i]; const len=L.length+1;
    if(pos+len>s && pos<e){ // line intersects selection
      lines[i] = "#".repeat(level)+" "+L.replace(/^\s*#{1,6}\s*/,""); // idempotent
    }
    pos+=len;
  }
  ta.value=lines.join("\n"); updateStats();
}
function clearSeparators(){
  const ta=getTA(); ta.value = cleanText(ta.value, true); updateStats();
}

/* -------------------- Cleaning -------------------- */
function cleanText(text, forceStripHashes=false){
  // 1) remove common emojis (keep words like "Got it")
  text = text.replace(/[👍👏🙏🔥✨💯🚀🌟⭐🌈🌸💡✅❌✔️✖️➡️⬅️⬆️⬇️🎯🎉🥳🧠💬🔔📌🔗]+/g, "");
  // 2) remove separator-only lines (---, ###, ***, ___)
  text = text.replace(/^[\s]*([-_*#])\1{2,}\s*$/gm, "");
  // 3) remove em-dash/dash bars like ————
  text = text.replace(/^[\s]*[—–-]{3,}\s*$/gm, "");
  // 4) optionally strip markdown heading hashes but keep text (for pasted AI content)
  if (forceStripHashes || document.getElementById("autoStripHashes").checked){
    text = text.replace(/^\s*#{1,6}\s+(.*)$/gm, "$1");
  }
  // 5) collapse 3+ blank lines → 2
  text = text.replace(/\n{3,}/g, "\n\n");
  return text;
}

/* -------------------- Stats -------------------- */
document.getElementById('inputText').addEventListener('input', updateStats);
function updateStats(){
  const text = document.getElementById('inputText').value;
  const words = text.trim()? text.trim().split(/\s+/).length : 0;
  const wordsPerPage = parseInt(document.getElementById('wordsPerPage').value||"400",10);
  const pages = Math.max(1, Math.ceil(words/wordsPerPage));
  const questions = (text.match(/\bq\d+/gi)||[]).length;
  document.getElementById('wordCount').textContent = words;
  document.getElementById('pageCount').textContent = pages;
  document.getElementById('questionCount').textContent = questions;
}

/* -------------------- Formatter -------------------- */
function toTitleCase(str){return str.replace(/\w\S*/g, t=>t[0].toUpperCase()+t.substr(1).toLowerCase());}
function capitalizeFirstLetter(str){return str? str[0].toUpperCase()+str.slice(1) : str;}

function formatAcademicText(){
  const raw = document.getElementById('inputText').value.trim();
  if(!raw){ alert('Please enter some text to format!'); return; }

  const cleaned = cleanText(raw);
  const wordsPerPage = parseInt(document.getElementById('wordsPerPage').value||"400",10);
  const addHeaders = document.getElementById('addHeaders').checked;

  let formattedText = '';
  let currentPage=1, wordsOnPage=0;

  const sections = cleaned.split(/(?=\bq\d+)/gi);
  sections.forEach((section, idx)=>{
    if(!section.trim()) return;

    const questionMatch = section.match(/^(q\d+[:\s]*[^.!?]*[.!?]?)/i);
    let sectionTitle='', sectionContent=section;

    if(questionMatch){
      sectionTitle = questionMatch[1].trim();
      sectionContent = section.replace(questionMatch[1], '').trim();
      if(addHeaders && idx>0){ formattedText += `\nP a g e ${currentPage} | 7\n`; }
      formattedText += `${toTitleCase(sectionTitle)}\n`;
      wordsOnPage += sectionTitle.split(/\s+/).length;
    }else if(idx===0){
      const firstLine = section.split('\n')[0] || section.substring(0,100);
      sectionTitle = firstLine;
      sectionContent = section.replace(firstLine,'').trim();
      formattedText += `${toTitleCase(sectionTitle)}\n\n`;
      wordsOnPage += sectionTitle.split(/\s+/).length;
    }

    const subsections = sectionContent.split(/(?=\([a-z]\))/i);
    subsections.forEach(sub=>{
      if(!sub.trim()) return;

      const sm = sub.match(/^(\([a-z]\)\s*[^.!?]*[.!?]?)/i);
      let subTitle='', content=sub;
      if(sm){ subTitle = sm[1].trim(); content = sub.replace(sm[1],'').trim(); formattedText += `${capitalizeFirstLetter(subTitle)}\n`; wordsOnPage += subTitle.split(/\s+/).length; }

      const sentences = content.split(/[.!?]+/).map(s=>s.trim()).filter(Boolean);
      let currentParagraph=[], targetWords = Math.max(80, Math.floor(wordsPerPage/5));

      sentences.forEach(sentence=>{
        const count = sentence.split(/\s+/).length;
        if(wordsOnPage + count > wordsPerPage){
          if(currentParagraph.length){
            let p = capitalizeFirstLetter(currentParagraph.join('. '))+'.';
            formattedText += p + '\n\n'; currentParagraph=[];
          }
          currentPage++; wordsOnPage=0;
          if(addHeaders){ formattedText += `P a g e ${currentPage} | 7\n`; }
        }
        currentParagraph.push(sentence); wordsOnPage += count;
        if(currentParagraph.join(' ').split(/\s+/).length >= targetWords){
          let p = capitalizeFirstLetter(currentParagraph.join('. '))+'.';
          formattedText += p + '\n'; currentParagraph=[];
        }
      });

      if(currentParagraph.length){
        let p = capitalizeFirstLetter(currentParagraph.join('. '))+'.';
        formattedText += p + '\n';
      }
      formattedText += '\n';
    });
  });

  // prepend Title / Author into output text block (kept simple; preview will place properly)
  const title = document.getElementById('docTitle').value.trim();
  const author = document.getElementById('authorName').value.trim();
  const type = document.getElementById('docType').value;
  let headerBlock = '';
  if(title){
    if(type==='resume'){ headerBlock += `# ${title}\n`; if(author) headerBlock += `_${author}_\n\n`; }
    else { headerBlock += `# ${title}\n`; if(author) headerBlock += `_${author}_\n\n`; }
  }
  document.getElementById('outputText').value = (headerBlock + formattedText).trim();

  // update paragraph count
  const paragraphs = formattedText.split('\n\n').filter(p=>p.trim().length>0);
  document.getElementById('paragraphCount').textContent = paragraphs.length;

  updatePreview(document.getElementById('outputText').value);
}

/* -------------------- Preview (markdown-lite render) -------------------- */
function mdToHTML(line){
  // headings
  if(/^#{3}\s+/.test(line)) return `<div class="preview-h3">${escapeHTML(line.replace(/^#{3}\s+/,''))}</div>`;
  if(/^#{2}\s+/.test(line)) return `<div class="preview-h2">${escapeHTML(line.replace(/^#{2}\s+/,''))}</div>`;
  if(/^#\s+/.test(line))   return `<div class="preview-h1">${escapeHTML(line.replace(/^#\s+/,''))}</div>`;
  // bold/italic
  let html = escapeHTML(line);
  html = html.replace(/\*\*(.+?)\*\*/g, '<span class="preview-bold">$1</span>');
  html = html.replace(/_(.+?)_/g, '<span class="preview-italic">$1</span>');
  return `<div class="preview-paragraph">${html}</div>`;
}
function escapeHTML(s){return s.replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}

function updatePreview(text){
  const fontFamily = document.getElementById('fontFamily').value;
  const fontSize = document.getElementById('fontSize').value + 'px';
  document.documentElement.style.setProperty('--preview-font', fontFamily);
  document.documentElement.style.setProperty('--preview-size', fontSize);

  const lines = text.split('\n');
  let previewHTML='', currentPage=1, pageContent='';

  const title = document.getElementById('docTitle').value.trim();
  const author = document.getElementById('authorName').value.trim();
  const type = document.getElementById('docType').value;

  const pushPage=()=>{ if(pageContent){ previewHTML += `<div class="preview-page"><div class="page-header">Page ${currentPage}</div>${pageContent}</div>`; pageContent=''; currentPage++; } };

  // Optional: show title block nicely on page 1
  if(title){
    if(type==='resume'){
      pageContent += `<div class="preview-h1">${escapeHTML(title)}</div>`;
      if(author) pageContent += `<div class="preview-italic" style="text-align:center;margin-bottom:12px;">${escapeHTML(author)}</div>`;
    }else{
      pageContent += `<div class="preview-title">${escapeHTML(title)}${author? `<div class="preview-italic" style="margin-top:6px;">${escapeHTML(author)}</div>`:""}</div>`;
    }
  }

  lines.forEach(line=>{
    if(line.includes('P a g e')){ pushPage(); }
    else if(line.trim()){ pageContent += mdToHTML(line); }
    else{ pageContent += '<br/>'; }
  });
  if(pageContent) pushPage();

  document.getElementById('previewContent').innerHTML = previewHTML || '<div style="text-align:center;color:#9ca3af;padding:40px;">Format your document to see the preview…</div>';
}

/* -------------------- Copy / Download -------------------- */
function copyToClipboard(){
  const out=document.getElementById('outputText'); if(!out.value){alert('No formatted text to copy!');return;}
  out.select(); out.setSelectionRange(0, 99999); document.execCommand('copy');
  const b=document.querySelector('.copy-btn'); const t=b.innerHTML; b.innerHTML='✅ Copied'; setTimeout(()=>b.innerHTML=t,2000);
}
function downloadText(){
  const txt=document.getElementById('outputText').value; if(!txt){alert('No formatted text to download!');return;}
  const blob=new Blob([txt],{type:'text/plain'}); const url=URL.createObjectURL(blob); const a=document.createElement('a');
  a.href=url;a.download='formatted_document.txt';document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);
  const b=document.querySelector('.download-btn'); const t=b.innerHTML; b.innerHTML='✅ Downloaded'; setTimeout(()=>b.innerHTML=t,2000);
}

/* -------------------- PDF (rich-ish text) -------------------- */
function generatePDF(){
  const outputText=document.getElementById('outputText').value;
  if(!outputText){alert('No formatted text to convert to PDF!');return;}

  const fontFamily=document.getElementById('fontFamily').value;
  const fontSize=parseInt(document.getElementById('fontSize').value,10);
  const lineSpacing=parseFloat(document.getElementById('lineSpacing').value);
  const addPageNumbers=document.getElementById('addPageNumbers').checked;
  const type=document.getElementById('docType').value;
  const title=document.getElementById('docTitle').value.trim();
  const author=document.getElementById('authorName').value.trim();

  // light validation
  if((type==='resume'||type==='academic') && !title){
    if(!confirm('Title is recommended for this document type. Continue without a title?')) return;
  }

  const pdf=new jsPDF({orientation:'portrait',unit:'pt',format:'a4'});
  let pdfFont='times';
  switch(fontFamily){case 'Arial':case 'Calibri': pdfFont='helvetica'; break; case 'Georgia': case 'Times New Roman': pdfFont='times';break; case 'Garamond': pdfFont='times'; break;}
  pdf.setFont(pdfFont,'normal'); pdf.setFontSize(fontSize);

  const pageWidth=595.28, pageHeight=841.89;
  const marginMap={narrow:36,normal:72,wide:108};
  const margin = marginMap[document.getElementById('margins').value] || 72;
  const textWidth = pageWidth - 2*margin;
  const leading = fontSize * lineSpacing;
  let y = margin + 10;

  const drawLine = (txt, style='normal', size=fontSize)=>{
    if(style==='bold') pdf.setFont(pdfFont,'bold'); else if(style==='italic') pdf.setFont(pdfFont,'italic'); else pdf.setFont(pdfFont,'normal');
    pdf.setFontSize(size);

    // simple word-wrap with inline **bold** and _italic_ spans
    const pieces = parseInline(txt); // [{text,style}]
    let currentX = margin, baseY=y;

    pieces.forEach(piece=>{
      const st = piece.style || 'normal';
      const runStyle = st==='bold'?'bold':(st==='italic'?'italic':'normal');
      if(runStyle==='bold') pdf.setFont(pdfFont,'bold'); else if(runStyle==='italic') pdf.setFont(pdfFont,'italic'); else pdf.setFont(pdfFont,'normal');

      const words = piece.text.split(/\s+/);
      words.forEach((w,idx)=>{
        const add = (idx>0?' ':'')+w;
        const width = pdf.getTextWidth(add);
        if((currentX - margin) + width > textWidth){
          pdf.text(add.trim(), currentX, baseY); // place last bit if any space remains
          baseY += leading; currentX = margin;
          if(baseY > pageHeight - margin){ pdf.addPage(); addPn(false); baseY = margin + 10; y = baseY; }
        }else{
          pdf.text(add, currentX, baseY);
          currentX += width;
        }
      });
    });

    y = baseY + leading*0.2; // small gap after line
    pdf.setFont(pdfFont,'normal'); pdf.setFontSize(fontSize);
  };

  const addPn = (finalPass=true)=>{
    if(!addPageNumbers) return;
    const total = pdf.internal.getNumberOfPages();
    const pg = finalPass ? total : pdf.internal.getCurrentPageInfo().pageNumber;
    for(let i=finalPass?1:pg; i<= (finalPass?total:pg); i++){
      pdf.setPage(i); pdf.setFontSize(10); pdf.setFont(pdfFont,'normal');
      const label = `P a g e ${i} | ${total}`;
      const w = pdf.getTextWidth(label);
      pdf.text(label, pageWidth - w - margin, margin - 12);
    }
  };

  const lines = outputText.split('\n');

  // Title block
  if(title){
    if(type==='resume'){
      pdf.setFont(pdfFont,'bold'); pdf.setFontSize(fontSize+6);
      const tw = pdf.getTextWidth(title); pdf.text(title, (pageWidth-tw)/2, y);
      y += leading*1.2;
      if(author){ pdf.setFont(pdfFont,'italic'); pdf.setFontSize(fontSize+1); const aw = pdf.getTextWidth(author); pdf.text(author,(pageWidth-aw)/2,y); y+=leading; }
      pdf.setFont(pdfFont,'normal'); pdf.setFontSize(fontSize);
    }else{
      pdf.setFont(pdfFont,'bold'); pdf.setFontSize(fontSize+4);
      const tw = pdf.getTextWidth(title); pdf.text(title, (pageWidth-tw)/2, y);
      y += leading;
      if(author){ pdf.setFont(pdfFont,'italic'); const aw = pdf.getTextWidth(author); pdf.text(author,(pageWidth-aw)/2,y); y+=leading; }
      pdf.setFont(pdfFont,'normal'); pdf.setFontSize(fontSize);
    }
  }

  // Body
  lines.forEach(line=>{
    if(line.includes('P a g e')){ // soft page break marker
      pdf.addPage(); addPn(false); y = margin + 10; return;
    }
    if(!line.trim()){ y += leading*0.5; return; }

    if(/^#{3}\s+/.test(line)){ y = ensureSpace(y,leading,pageHeight,margin,pdf,addPn); pdf.setFont(pdfFont,'bold'); pdf.setFontSize(fontSize+1); pdf.text(line.replace(/^#{3}\s+/,''), margin, y); y+=leading; pdf.setFont(pdfFont,'normal'); pdf.setFontSize(fontSize); return; }
    if(/^#{2}\s+/.test(line)){ y = ensureSpace(y,leading,pageHeight,margin,pdf,addPn); pdf.setFont(pdfFont,'bold'); pdf.setFontSize(fontSize+2); pdf.text(line.replace(/^#{2}\s+/,''), margin, y); y+=leading; pdf.setFont(pdfFont,'normal'); pdf.setFontSize(fontSize); return; }
    if(/^#\s+/.test(line)){   y = ensureSpace(y,leading,pageHeight,margin,pdf,addPn); pdf.setFont(pdfFont,'bold'); pdf.setFontSize(fontSize+3); const txt=line.replace(/^#\s+/,''); const w=pdf.getTextWidth(txt); pdf.text(txt,(pageWidth-w)/2,y); y+=leading; pdf.setFont(pdfFont,'normal'); pdf.setFontSize(fontSize); return; }

    // normal paragraph with inline styles
    y = ensureSpace(y,leading,pageHeight,margin,pdf,addPn);
    drawLine(line,'normal',fontSize);
    y += leading*0.4;
  });

  addPn(true);

  let fileName='formatted_document.pdf';
  switch(type){
    case'general':fileName='general_document.pdf';break;
    case'report':fileName='business_report.pdf';break;
    case'academic':fileName='academic_paper.pdf';break;
    case'assignment':fileName='assignment.pdf';break;
    case'resume':fileName='resume.pdf';break;
    case'letter':fileName='formal_letter.pdf';break;
    case'essay':fileName='essay_article.pdf';break;
    case'memo':fileName='memo_notice.pdf';break;
    case'thesis':fileName='thesis_document.pdf';break;
  }
  pdf.save(fileName);

  const pdfBtn=document.querySelector('.pdf-btn'), t=pdfBtn.innerHTML;
  pdfBtn.innerHTML='✅ PDF Generated!'; pdfBtn.style.background='linear-gradient(135deg,#059669,#047857)';
  setTimeout(()=>{pdfBtn.innerHTML=t; pdfBtn.style.background='linear-gradient(135deg,#dc2626,#991b1b)';},2500);
}

function ensureSpace(y,leading,pageHeight,margin,pdf,addPn){
  if(y > pageHeight - margin - leading){ pdf.addPage(); addPn(false); return margin + 10; }
  return y;
}
function parseInline(txt){
  // returns array of {text,style?}
  const out=[]; let i=0;
  const push=(t,s)=>{ if(!t) return; out.push({text:t,style:s}); };
  while(i<txt.length){
    const b = txt.indexOf('**', i);
    const it = txt.indexOf('_', i);
    let next = -1, kind='';
    if(b!==-1 && (it===-1 || b<it)){ next=b; kind='bold'; }
    else if(it!==-1){ next=it; kind='italic'; }
    if(next===-1){ push(txt.slice(i),'normal'); break; }
    if(next>i) push(txt.slice(i,next),'normal');
    if(kind==='bold'){
      const end = txt.indexOf('**', next+2);
      if(end===-1){ push(txt.slice(next),'normal'); break; }
      push(txt.slice(next+2,end),'bold'); i=end+2;
    }else{
      const end = txt.indexOf('_', next+1);
      if(end===-1){ push(txt.slice(next),'normal'); break; }
      push(txt.slice(next+1,end),'italic'); i=end+1;
    }
  }
  return out;
}
