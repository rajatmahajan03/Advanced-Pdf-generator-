<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Academic PDF Text Formatter</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 50%, #667eea 100%);
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        .floating-shapes {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }
        
        .shape {
            position: absolute;
            opacity: 0.1;
            animation: float 20s infinite linear;
        }
        
        .shape:nth-child(1) {
            top: 20%;
            left: 10%;
            width: 80px;
            height: 80px;
            background: #ff6b6b;
            border-radius: 50%;
            animation-delay: 0s;
        }
        
        .shape:nth-child(2) {
            top: 70%;
            right: 15%;
            width: 60px;
            height: 60px;
            background: #4ecdc4;
            transform: rotate(45deg);
            animation-delay: -5s;
        }
        
        .shape:nth-child(3) {
            top: 40%;
            right: 20%;
            width: 100px;
            height: 100px;
            background: #ffe66d;
            clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
            animation-delay: -10s;
        }
        
        @keyframes float {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(180deg); }
            100% { transform: translateY(0px) rotate(360deg); }
        }
        
        .container {
            position: relative;
            z-index: 2;
            max-width: 1600px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.98);
            border-radius: 25px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            backdrop-filter: blur(10px);
            margin-top: 20px;
            margin-bottom: 20px;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            padding: 40px;
            text-align: center;
            color: white;
            position: relative;
            overflow: hidden;
        }
        
        .header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="2" fill="rgba(255,255,255,0.1)"/></svg>') repeat;
            animation: sparkle 3s linear infinite;
        }
        
        @keyframes sparkle {
            0% { transform: translateX(0) translateY(0); }
            100% { transform: translateX(-100px) translateY(-100px); }
        }
        
        .header h1 {
            font-size: 3em;
            margin-bottom: 15px;
            font-weight: 800;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            position: relative;
            z-index: 1;
        }
        
        .header p {
            font-size: 1.3em;
            opacity: 0.95;
            position: relative;
            z-index: 1;
            font-weight: 300;
        }
        
        .main-content {
            display: grid;
            grid-template-columns: 2fr 3fr;
            min-height: 800px;
        }
        
        .input-section {
            padding: 40px;
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            border-right: 2px solid #cbd5e0;
        }
        
        .output-section {
            padding: 40px;
            background: linear-gradient(135deg, #ffffff 0%, #f7fafc 100%);
        }
        
        .section-title {
            font-size: 1.6em;
            font-weight: 700;
            color: #2d3748;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 12px;
            padding-bottom: 10px;
            border-bottom: 3px solid #667eea;
        }
        
        .icon {
            font-size: 1.4em;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .academic-settings {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
            margin-bottom: 25px;
        }
        
        .settings-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        .form-group label {
            font-weight: 600;
            color: #4a5568;
            font-size: 0.95em;
        }
        
        .form-group select,
        .form-group input {
            padding: 12px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 1em;
            transition: all 0.3s ease;
            background: white;
        }
        
        .form-group select:focus,
        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
            transform: translateY(-1px);
        }
        
        .advanced-options {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 15px;
            margin-top: 20px;
        }
        
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .checkbox-group input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #667eea;
        }
        
        .textarea-container {
            position: relative;
            margin-bottom: 25px;
        }
        
        .input-textarea {
            width: 100%;
            height: 350px;
            padding: 20px;
            border: 2px solid #e2e8f0;
            border-radius: 15px;
            font-family: 'Georgia', serif;
            font-size: 15px;
            line-height: 1.6;
            resize: vertical;
            transition: all 0.3s ease;
            background: white;
        }
        
        .input-textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        }
        
        .format-btn {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            color: white;
            border: none;
            border-radius: 15px;
            font-size: 1.2em;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.4s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.3);
        }
        
        .format-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(102, 126, 234, 0.4);
        }
        
        .format-btn:active {
            transform: translateY(-1px);
        }
        
        .output-textarea {
            width: 100%;
            height: 400px;
            padding: 20px;
            border: 2px solid #d1d5db;
            border-radius: 15px;
            font-family: 'Times New Roman', serif;
            font-size: 12px;
            line-height: 1.4;
            background: #f9fafb;
            resize: vertical;
            margin-bottom: 20px;
        }
        
        .action-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 15px;
            margin-bottom: 25px;
        }
        
        .copy-btn, .download-btn, .pdf-btn {
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        .copy-btn {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
        }
        
        .download-btn {
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            color: white;
        }
        
        .pdf-btn {
            background: linear-gradient(135deg, #dc2626, #991b1b);
            color: white;
            font-weight: 700;
        }
        
        .copy-btn:hover, .download-btn:hover, .pdf-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }
        
        .stats-panel {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
            margin-bottom: 25px;
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
        }
        
        .stat-card {
            text-align: center;
            padding: 15px;
            background: linear-gradient(135deg, #f8fafc, #e2e8f0);
            border-radius: 10px;
            border: 1px solid #cbd5e0;
        }
        
        .stat-value {
            font-size: 1.8em;
            font-weight: 800;
            color: #667eea;
            display: block;
        }
        
        .stat-label {
            font-size: 0.9em;
            color: #6b7280;
            margin-top: 5px;
            font-weight: 500;
        }
        
        .preview-panel {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
            border: 2px solid #e5e7eb;
        }
        
        .preview-content {
            font-family: var(--preview-font);
            font-size: var(--preview-size);
            line-height: 1.4;
            color: #1f2937;
        }
        
        .preview-header {
            text-align: center;
            font-weight: bold;
            font-size: 1.2em;
            margin-bottom: 10px;
            padding-bottom: 10px;
            border-bottom: 1px solid #e5e7eb;
        }
        
        .preview-page {
            margin-bottom: 20px;
            padding: 15px;
            border: 1px dashed #cbd5e0;
            border-radius: 8px;
        }
        
        .preview-paragraph {
            text-align: justify;
            margin-bottom: 12px;
            text-indent: 20px;
        }
        
        .preview-title {
            text-align: center;
            font-weight: bold;
            font-size: 1.3em;
            margin-bottom: 20px;
            text-transform: uppercase;
        }
        
        .page-header {
            text-align: right;
            font-size: 0.9em;
            color: #6b7280;
            margin-bottom: 15px;
            font-style: italic;
        }
        
        @media (max-width: 1200px) {
            .main-content {
                grid-template-columns: 1fr;
            }
            
            .input-section {
                border-right: none;
                border-bottom: 2px solid #cbd5e0;
            }
            
            .settings-grid {
                grid-template-columns: 1fr;
            }
            
            .advanced-options {
                grid-template-columns: 1fr;
            }
            
            .stats {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        
                    @media (max-width: 768px) {
            .action-buttons {
                grid-template-columns: 1fr;
            }
            
            .header h1 {
                font-size: 2em;
            }
            
            .stats {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="floating-shapes">
        <div class="shape"></div>
        <div class="shape"></div>
        <div class="shape"></div>
    </div>

    <div class="container">
        <div class="header">
            <h1>📚 Advanced Academic PDF Formatter</h1>
            <p>Professional document formatting for academic papers, assignments & reports</p>
        </div>
        
        <div class="main-content">
            <div class="input-section">
                <h2 class="section-title">
                    <span class="icon">⚙️</span>
                    Document Settings & Input
                </h2>
                
                <div class="academic-settings">
                    <div class="settings-grid">
                        <div class="form-group">
                            <label>Document Type</label>
                            <select id="docType">
                                <option value="academic">Academic Paper</option>
                                <option value="assignment">Assignment</option>
                                <option value="report">Business Report</option>
                                <option value="thesis">Thesis/Dissertation</option>
                            </select>
                        </div>
                        
                        <div class="form-group">
                            <label>Font Family</label>
                            <select id="fontFamily">
                                <option value="Times New Roman" selected>Times New Roman</option>
                                <option value="Arial">Arial</option>
                                <option value="Georgia">Georgia</option>
                                <option value="Calibri">Calibri</option>
                                <option value="Garamond">Garamond</option>
                            </select>
                        </div>
                        
                        <div class="form-group">
                            <label>Font Size</label>
                            <select id="fontSize">
                                <option value="10">10pt</option>
                                <option value="11">11pt</option>
                                <option value="12" selected>12pt</option>
                                <option value="14">14pt</option>
                                <option value="16">16pt</option>
                            </select>
                        </div>
                        
                        <div class="form-group">
                            <label>Words Per Page</label>
                            <input type="number" id="wordsPerPage" value="400" min="200" max="800">
                        </div>
                        
                        <div class="form-group">
                            <label>Line Spacing</label>
                            <select id="lineSpacing">
                                <option value="1.0">Single (1.0)</option>
                                <option value="1.15">1.15</option>
                                <option value="1.3" selected>1.3</option>
                                <option value="1.5">1.5</option>
                                <option value="2.0">Double (2.0)</option>
                            </select>
                        </div>
                        
                        <div class="form-group">
                            <label>Page Margins</label>
                            <select id="margins">
                                <option value="normal" selected>Normal (1 inch)</option>
                                <option value="narrow">Narrow (0.5 inch)</option>
                                <option value="wide">Wide (1.5 inch)</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="advanced-options">
                        <div class="checkbox-group">
                            <input type="checkbox" id="addPageNumbers" checked>
                            <label for="addPageNumbers">Add Page Numbers</label>
                        </div>
                        <div class="checkbox-group">
                            <input type="checkbox" id="addHeaders" checked>
                            <label for="addHeaders">Page Headers</label>
                        </div>
                        <div class="checkbox-group">
                            <input type="checkbox" id="justifyText" checked>
                            <label for="justifyText">Justify Text</label>
                        </div>
                    </div>
                </div>
                
                <div class="textarea-container">
                    <textarea 
                        class="input-textarea" 
                        id="inputText" 
                        placeholder="Paste your raw academic content here...

Example format:
branded flour atta market entry designing the positioning and brand building strategy when entering the branded flour market the first step is to clearly define the target segment in this case the potential market could be urban households nuclear families and health conscious consumers..."
                    ></textarea>
                </div>
                
                <button class="format-btn" onclick="formatAcademicText()">
                    <span>✨</span>
                    Format Document
                </button>
                
                <div class="stats-panel">
                    <div class="stats">
                        <div class="stat-card">
                            <span class="stat-value" id="wordCount">0</span>
                            <span class="stat-label">Words</span>
                        </div>
                        <div class="stat-card">
                            <span class="stat-value" id="pageCount">0</span>
                            <span class="stat-label">Pages</span>
                        </div>
                        <div class="stat-card">
                            <span class="stat-value" id="paragraphCount">0</span>
                            <span class="stat-label">Paragraphs</span>
                        </div>
                        <div class="stat-card">
                            <span class="stat-value" id="questionCount">0</span>
                            <span class="stat-label">Questions</span>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="output-section">
                <h2 class="section-title">
                    <span class="icon">📋</span>
                    Formatted Document Output
                </h2>
                
                <textarea 
                    class="output-textarea" 
                    id="outputText" 
                    readonly
                    placeholder="Your professionally formatted academic document will appear here..."
                ></textarea>
                
                <div class="action-buttons">
                    <button class="copy-btn" onclick="copyToClipboard()">
                        📋 Copy Text
                    </button>
                    <button class="download-btn" onclick="downloadText()">
                        💾 Download TXT
                    </button>
                    <button class="pdf-btn" onclick="generatePDF()">
                        📄 Generate PDF
                    </button>
                </div>
                
                <div class="preview-panel">
                    <h3 style="margin-bottom: 15px; color: #374151; font-weight: 600;">📖 Live Preview</h3>
                    <div class="preview-content" id="previewContent">
                        <div style="text-align: center; color: #9ca3af; padding: 40px;">
                            Format your document to see the live preview...
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script>
        const { jsPDF } = window.jspdf;
        // Update stats in real-time
        document.getElementById('inputText').addEventListener('input', function() {
            updateStats();
        });

        function updateStats() {
            const text = document.getElementById('inputText').value;
            const words = text.trim() ? text.trim().split(/\s+/).length : 0;
            const wordsPerPage = parseInt(document.getElementById('wordsPerPage').value);
            const pages = Math.ceil(words / wordsPerPage);
            
            // Count questions (lines starting with Q followed by number)
            const questions = (text.match(/\bq\d+/gi) || []).length;
            
            document.getElementById('wordCount').textContent = words;
            document.getElementById('pageCount').textContent = pages;
            document.getElementById('questionCount').textContent = questions;
        }

        function toTitleCase(str) {
            return str.replace(/\w\S*/g, (txt) => {
                return txt.charAt(0).toUpperCase() + txt.substr(1).toLowerCase();
            });
        }

        function capitalizeFirstLetter(str) {
            return str.charAt(0).toUpperCase() + str.slice(1);
        }

        function formatAcademicText() {
            const inputText = document.getElementById('inputText').value.trim();
            if (!inputText) {
                alert('Please enter some text to format!');
                return;
            }

            const wordsPerPage = parseInt(document.getElementById('wordsPerPage').value);
            const addPageNumbers = document.getElementById('addPageNumbers').checked;
            const addHeaders = document.getElementById('addHeaders').checked;
            
            let formattedText = '';
            let currentPage = 1;
            let wordsOnCurrentPage = 0;
            
            // Split into sections based on questions or major headings
            const sections = inputText.split(/(?=\bq\d+)/gi);
            
            sections.forEach((section, sectionIndex) => {
                if (!section.trim()) return;
                
                // Check if this is a question section
                const questionMatch = section.match(/^(q\d+[:\s]*[^.!?]*[.!?]?)/i);
                let sectionTitle = '';
                let sectionContent = section;
                
                if (questionMatch) {
                    sectionTitle = questionMatch[1].trim();
                    sectionContent = section.replace(questionMatch[1], '').trim();
                    
                    // Add page header if enabled
                    if (addHeaders && sectionIndex > 0) {
                        formattedText += `\nP a g e ${currentPage} | 7\n`;
                    }
                    
                    // Format question title
                    formattedText += `${toTitleCase(sectionTitle)}\n`;
                    wordsOnCurrentPage += sectionTitle.split(/\s+/).length;
                } else if (sectionIndex === 0) {
                    // First section might be title
                    const firstLine = section.split('\n')[0] || section.substring(0, 100);
                    sectionTitle = firstLine;
                    sectionContent = section.replace(firstLine, '').trim();
                    
                    formattedText += `${toTitleCase(sectionTitle)}\n\n`;
                    wordsOnCurrentPage += sectionTitle.split(/\s+/).length;
                }
                
                // Process subsections (a), (b), (c) etc.
                const subsections = sectionContent.split(/(?=\([a-z]\))/i);
                
                subsections.forEach(subsection => {
                    if (!subsection.trim()) return;
                    
                    const subsectionMatch = subsection.match(/^(\([a-z]\)\s*[^.!?]*[.!?]?)/i);
                    let subsectionTitle = '';
                    let subsectionContent = subsection;
                    
                    if (subsectionMatch) {
                        subsectionTitle = subsectionMatch[1].trim();
                        subsectionContent = subsection.replace(subsectionMatch[1], '').trim();
                        
                        formattedText += `${capitalizeFirstLetter(subsectionTitle)}\n`;
                        wordsOnCurrentPage += subsectionTitle.split(/\s+/).length;
                    }
                    
                    // Split content into paragraphs
                    const sentences = subsectionContent.split(/[.!?]+/).map(s => s.trim()).filter(s => s.length > 0);
                    let currentParagraph = [];
                    let targetWordsPerParagraph = Math.max(80, Math.floor(wordsPerPage / 5));
                    
                    sentences.forEach(sentence => {
                        if (!sentence) return;
                        
                        const sentenceWords = sentence.split(/\s+/).length;
                        
                        // Check if we need a new page
                        if (wordsOnCurrentPage + sentenceWords > wordsPerPage) {
                            if (currentParagraph.length > 0) {
                                let paragraphText = currentParagraph.join('. ') + '.';
                                paragraphText = capitalizeFirstLetter(paragraphText);
                                formattedText += paragraphText + '\n\n';
                                currentParagraph = [];
                            }
                            
                            currentPage++;
                            wordsOnCurrentPage = 0;
                            
                            if (addHeaders) {
                                formattedText += `P a g e ${currentPage} | 7\n`;
                            }
                        }
                        
                        currentParagraph.push(sentence);
                        wordsOnCurrentPage += sentenceWords;
                        
                        // End paragraph when target length reached
                        if (currentParagraph.join(' ').split(/\s+/).length >= targetWordsPerParagraph) {
                            let paragraphText = currentParagraph.join('. ') + '.';
                            paragraphText = capitalizeFirstLetter(paragraphText);
                            formattedText += paragraphText + '\n';
                            currentParagraph = [];
                        }
                    });
                    
                    // Add remaining content
                    if (currentParagraph.length > 0) {
                        let paragraphText = currentParagraph.join('. ') + '.';
                        paragraphText = capitalizeFirstLetter(paragraphText);
                        formattedText += paragraphText + '\n';
                    }
                    
                    formattedText += '\n';
                });
            });

            document.getElementById('outputText').value = formattedText.trim();
            
            // Update paragraph count
            const paragraphs = formattedText.split('\n\n').filter(p => p.trim().length > 0);
            document.getElementById('paragraphCount').textContent = paragraphs.length;
            
            updatePreview(formattedText);
        }

        function updatePreview(formattedText) {
            const fontFamily = document.getElementById('fontFamily').value;
            const fontSize = document.getElementById('fontSize').value + 'px';
            const lineSpacing = document.getElementById('lineSpacing').value;
            
            document.documentElement.style.setProperty('--preview-font', fontFamily);
            document.documentElement.style.setProperty('--preview-size', fontSize);
            
            const lines = formattedText.split('\n');
            let previewHTML = '';
            let currentPage = 1;
            let pageContent = '';
            
            lines.forEach(line => {
                if (line.includes('P a g e')) {
                    if (pageContent) {
                        previewHTML += `<div class="preview-page">
                            <div class="page-header">Page ${currentPage}</div>
                            ${pageContent}
                        </div>`;
                        currentPage++;
                        pageContent = '';
                    }
                } else if (line.trim()) {
                    if (line.match(/^Q\d+/)) {
                        pageContent += `<div class="preview-title">${line}</div>`;
                    } else if (line.match(/^\([a-z]\)/i)) {
                        pageContent += `<div style="font-weight: bold; margin: 15px 0 10px 0;">${line}</div>`;
                    } else {
                        pageContent += `<div class="preview-paragraph">${line}</div>`;
                    }
                } else {
                    pageContent += '<br>';
                }
            });
            
            if (pageContent) {
                previewHTML += `<div class="preview-page">
                    <div class="page-header">Page ${currentPage}</div>
                    ${pageContent}
                </div>`;
            }
            
            document.getElementById('previewContent').innerHTML = previewHTML || '<div style="text-align: center; color: #9ca3af; padding: 40px;">Format your document to see the preview...</div>';
        }

        function copyToClipboard() {
            const outputText = document.getElementById('outputText');
            if (!outputText.value) {
                alert('No formatted text to copy! Please format some text first.');
                return;
            }
            
            outputText.select();
            outputText.setSelectionRange(0, 99999);
            
            try {
                document.execCommand('copy');
                
                const copyBtn = document.querySelector('.copy-btn');
                const originalText = copyBtn.innerHTML;
                copyBtn.innerHTML = '✅ Copied Successfully!';
                
                setTimeout(() => {
                    copyBtn.innerHTML = originalText;
                }, 2500);
                
            } catch (err) {
                alert('Copy failed. Please select the text manually and copy.');
            }
        }

        function downloadText() {
            const outputText = document.getElementById('outputText').value;
            if (!outputText) {
                alert('No formatted text to download! Please format some text first.');
                return;
            }
            
            const blob = new Blob([outputText], { type: 'text/plain' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'formatted_document.txt';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            window.URL.revokeObjectURL(url);
            
            const downloadBtn = document.querySelector('.download-btn');
            const originalText = downloadBtn.innerHTML;
            downloadBtn.innerHTML = '✅ Downloaded!';
            
            setTimeout(() => {
                downloadBtn.innerHTML = originalText;
            }, 2500);
        }

        function generatePDF() {
            const outputText = document.getElementById('outputText').value;
            if (!outputText) {
                alert('No formatted text to convert to PDF! Please format some text first.');
                return;
            }

            const fontFamily = document.getElementById('fontFamily').value;
            const fontSize = parseInt(document.getElementById('fontSize').value);
            const lineSpacing = parseFloat(document.getElementById('lineSpacing').value);
            const addPageNumbers = document.getElementById('addPageNumbers').checked;
            
            // Create new PDF document
            const pdf = new jsPDF({
                orientation: 'portrait',
                unit: 'pt',
                format: 'a4'
            });

            // Set font
            let pdfFont = 'times';
            switch(fontFamily) {
                case 'Arial': pdfFont = 'helvetica'; break;
                case 'Georgia': case 'Times New Roman': pdfFont = 'times'; break;
                case 'Calibri': pdfFont = 'helvetica'; break;
                default: pdfFont = 'times';
            }

            pdf.setFont(pdfFont, 'normal');
            pdf.setFontSize(fontSize);

            // Page dimensions (A4 in points: 595.28 x 841.89)
            const pageWidth = 595.28;
            const pageHeight = 841.89;
            const margin = 72; // 1 inch margins
            const textWidth = pageWidth - (2 * margin);
            const lineHeight = fontSize * lineSpacing;
            
            let yPosition = margin + 20;
            let pageNumber = 1;

            // Split text into lines and process
            const lines = outputText.split('\n');
            
            lines.forEach((line, index) => {
                if (!line.trim() && index < lines.length - 1) {
                    yPosition += lineHeight / 2; // Half line for empty lines
                    return;
                }

                // Check if this is a page header line
                if (line.includes('P a g e')) {
                    // Skip the page header line from input, we'll add our own
                    return;
                }

                // Handle different line types
                if (line.match(/^Q\d+/)) {
                    // Question title - bold and larger
                    pdf.setFont(pdfFont, 'bold');
                    pdf.setFontSize(fontSize + 2);
                    
                    // Check if we need a new page
                    if (yPosition > pageHeight - margin - 50) {
                        pdf.addPage();
                        yPosition = margin + 20;
                        pageNumber++;
                    }
                    
                    // Center the question title
                    const textWidth = pdf.getTextWidth(line);
                    const centerX = (pageWidth - textWidth) / 2;
                    pdf.text(line, centerX, yPosition);
                    yPosition += lineHeight + 10;
                    
                    pdf.setFont(pdfFont, 'normal');
                    pdf.setFontSize(fontSize);
                    
                } else if (line.match(/^\([a-z]\)/i)) {
                    // Subsection title - bold
                    pdf.setFont(pdfFont, 'bold');
                    
                    if (yPosition > pageHeight - margin - 30) {
                        pdf.addPage();
                        yPosition = margin + 20;
                        pageNumber++;
                    }
                    
                    pdf.text(line, margin, yPosition);
                    yPosition += lineHeight + 5;
                    pdf.setFont(pdfFont, 'normal');
                    
                } else if (line.trim()) {
                    // Regular paragraph text
                    const words = line.split(' ');
                    let currentLine = '';
                    
                    words.forEach(word => {
                        const testLine = currentLine + (currentLine ? ' ' : '') + word;
                        const testWidth = pdf.getTextWidth(testLine);
                        
                        if (testWidth > textWidth && currentLine) {
                            // Check if we need a new page
                            if (yPosition > pageHeight - margin - lineHeight) {
                                pdf.addPage();
                                yPosition = margin + 20;
                                pageNumber++;
                            }
                            
                            pdf.text(currentLine, margin, yPosition);
                            yPosition += lineHeight;
                            currentLine = word;
                        } else {
                            currentLine = testLine;
                        }
                    });
                    
                    // Print the last line
                    if (currentLine) {
                        if (yPosition > pageHeight - margin - lineHeight) {
                            pdf.addPage();
                            yPosition = margin + 20;
                            pageNumber++;
                        }
                        
                        pdf.text(currentLine, margin, yPosition);
                        yPosition += lineHeight + 3;
                    }
                }
            });

            // Add page numbers if enabled
            if (addPageNumbers) {
                const totalPages = pdf.internal.getNumberOfPages();
                for (let i = 1; i <= totalPages; i++) {
                    pdf.setPage(i);
                    pdf.setFontSize(10);
                    pdf.setFont(pdfFont, 'normal');
                    
                    // Add page header like "P a g e 1 | 7"
                    const pageHeader = `P a g e ${i} | ${totalPages}`;
                    const headerWidth = pdf.getTextWidth(pageHeader);
                    pdf.text(pageHeader, pageWidth - headerWidth - margin, margin - 20);
                }
            }

            // Save the PDF
            const docType = document.getElementById('docType').value;
            let fileName = 'formatted_document.pdf';
            
            switch(docType) {
                case 'academic': fileName = 'academic_paper.pdf'; break;
                case 'assignment': fileName = 'assignment.pdf'; break;
                case 'report': fileName = 'business_report.pdf'; break;
                case 'thesis': fileName = 'thesis_document.pdf'; break;
            }

            pdf.save(fileName);
            
            // Update button feedback
            const pdfBtn = document.querySelector('.pdf-btn');
            const originalText = pdfBtn.innerHTML;
            pdfBtn.innerHTML = '✅ PDF Generated!';
            pdfBtn.style.background = 'linear-gradient(135deg, #059669, #047857)';
            
            setTimeout(() => {
                pdfBtn.innerHTML = originalText;
                pdfBtn.style.background = 'linear-gradient(135deg, #dc2626, #991b1b)';
            }, 3000);
        }

        // Initialize stats on page load
        updateStats();
    </script>
